[package]
name = "mocktail-core"
version = "0.1.0"
edition = "2021"
authors = ["Qazcto7"]
description = "High-performance, memory-safe Rust core for Mocktail"

[lib]
name = "mocktail_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
